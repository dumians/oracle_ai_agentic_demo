# ==============================================================================
# 🏛️ Google Cloud Run Service: Oracle AI Private Agent Factory 26.7.0 (PAIAS)
# ==============================================================================
# Official Docs: https://docs.oracle.com/en/database/oracle/agent-factory/26.4/paias/
# Downloads:     https://www.oracle.com/database/technologies/private-agent-factory-downloads.html
# ==============================================================================
# This Knative manifest deploys the official Oracle AI Database Private Agent
# Factory 26.7.0 container on Google Cloud Run in Headless API Mode (without UIX)
# with Serverless VPC Access, mTLS wallet volume mounts, and Vertex AI.
# ==============================================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: oracle-paf-26-7
  namespace: default
  labels:
    cloud.googleapis.com/location: europe-west3
    app.kubernetes.io/name: oracle-private-agent-factory
    app.kubernetes.io/version: "26.7.0"
    app.kubernetes.io/component: paias-runtime-headless
    app.kubernetes.io/part-of: oracle-database-ai
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/vpc-access-connector: projects/total-vertex-469513-r8/locations/europe-west3/connectors/oracle-db-connector
    run.googleapis.com/vpc-access-egress: private-ranges-only
    run.googleapis.com/description: "Oracle AI Database Private Agent Factory (PAIAS 26.7.0) Headless API on GCP Cloud Run"

spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
      labels:
        app: oracle-paf-26-7
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: oracle-agent-factory-sa@total-vertex-469513-r8.iam.gserviceaccount.com

      containers:
      # Target image: Artifact Registry in europe-west3
      - image: europe-west3-docker.pkg.dev/total-vertex-469513-r8/oracle-ai/private-agent-factory:26.7.0
        name: paias-agent-factory-core
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "1000m"
            memory: "2Gi"

        env:
        # PAIAS 26.7 Core & Headless Configuration (Without UIX)
        - name: PAIAS_VERSION
          value: "26.7.0"
        - name: PORT
          value: "8080"
        - name: NODE_ENV
          value: "production"
        - name: ENABLE_UIX
          value: "false"
        - name: HEADLESS_MODE
          value: "true"
        - name: PAIAS_MODE
          value: "headless"
        - name: AGENT_FACTORY_MODE
          value: "production"

        # Oracle Database@Google Cloud Private Endpoint Connection
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: oracle-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oracle-db-credentials
              key: password
        - name: DB_DSN
          value: "(description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=gcp-europe-west3.adb.eu-frankfurt-1.oraclecloud.com))(connect_data=(service_name=g7fc8bfc0a44b0c_jdatpai02_medium.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))"
        - name: DB_WALLET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oracle-db-credentials
              key: wallet_password
        - name: TNS_ADMIN
          value: "/etc/oracle/wallet"

        # Vertex AI Agent Engine & Gemini Model Integration
        - name: GCP_PROJECT_ID
          value: "total-vertex-469513-r8"
        - name: GCP_REGION
          value: "europe-west3"
        - name: GOOGLE_CLOUD_PROJECT
          value: "total-vertex-469513-r8"
        - name: GOOGLE_CLOUD_LOCATION
          value: "europe-west3"
        - name: COORDINATOR_MODEL
          value: "gemini-2.0-flash"
        - name: GEMINI_MODEL_PRIMARY
          value: "gemini-2.0-flash"
        - name: GEMINI_MODEL_FLASH
          value: "gemini-2.0-flash"
        - name: GEMINI_EMBEDDING_MODEL
          value: "text-embedding-005"

        # Security & OCI Governance
        - name: OCI_AUTH_TYPE
          value: "gcp_federated_workload_identity"
        - name: AUDIT_LOGGING_ENABLED
          value: "true"
        - name: SQL_EXECUTION_MAX_ROWS
          value: "5000"

        # Volume Mounts for Oracle mTLS Wallet Secret
        volumeMounts:
        - name: oracle-mtls-wallet
          mountPath: /etc/oracle/wallet
          readOnly: true

        # Health Probes
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12

        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 3

      # Secret Volume definition
      volumes:
      - name: oracle-mtls-wallet
        secret:
          secretName: oracle-adbs-mtls-wallet
          items:
          - key: cwallet.sso
            path: cwallet.sso
          - key: tnsnames.ora
            path: tnsnames.ora
          - key: sqlnet.ora
            path: sqlnet.ora
