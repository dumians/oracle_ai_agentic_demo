# ==============================================================================
# 🐳 Docker Compose: Oracle AI Database Private Agent Factory 26.4 (PAIAS)
# ==============================================================================
# Documentation: https://docs.oracle.com/en/database/oracle/agent-factory/26.4/paias/
# Downloads:     https://www.oracle.com/database/technologies/private-agent-factory-downloads.html
# ==============================================================================

version: '3.8'

services:
  oracle-paf-core:
    image: oracle-private-agent-factory:26.4
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: oracle-paf-26-4-core
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PAIAS_VERSION=26.4
      - PAIAS_PROMPT_LAB_ENABLED=true
      - PAIAS_DATA_PRODUCT_CONTRACT=v1.2
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-total-vertex-469513-r8}
      - GCP_REGION=${GCP_REGION:-eu-west3}
      - COORDINATOR_MODEL=${COORDINATOR_MODEL:-gemini-3.1-flash}
      - DB_DSN=${DB_DSN:-adbs_high}
      - DB_USERNAME=${DB_USERNAME:-ADMIN}
      - DB_PASSWORD=${DB_PASSWORD:-Welcome12345#}
      - DB_WALLET_DIR=/secrets/oracle-wallet
      - TNS_ADMIN=/secrets/oracle-wallet
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp/key.json
    volumes:
      - ../.oracle_wallet:/secrets/oracle-wallet:ro
      - ~/.config/gcloud/application_default_credentials.json:/secrets/gcp/key.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
